name: App tests

on:
  pull_request:
    paths:
      - "mobile_app/**"
      - "dashboard_app/**"
      - ".github/workflows/app-tests.yml"
  push:
    branches: [main]
    paths:
      - "mobile_app/**"
      - "dashboard_app/**"
      - ".github/workflows/app-tests.yml"

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"  # pubspec.lock was resolved with Flutter 3.38
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
